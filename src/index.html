<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Amigo Secreto - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 420px;
            margin: 40px auto;
            padding: 0 16px;
            background: #f4f4f4;
            color: #222;
        }

        h1 { text-align: center; }
        h2 { margin-top: 32px; font-size: 18px; }

        form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: white;
            padding: 16px;
            border-radius: 8px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #2d6cdf;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #1f55b8; }

        ul { padding-left: 20px; }
        li { margin-bottom: 6px; }

        a { color: #2d6cdf; }

        .abas {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .aba {
            flex: 1;
            background: #ddd;
            color: #555;
        }

        .aba:hover { background: #ccc; }

        .aba.ativa {
            background: #2d6cdf;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Amigo Secreto</h1>

    <div class="abas">
        <button type="button" id="abaLogin" class="aba ativa">Entrar</button>
        <button type="button" id="abaCadastro" class="aba">Cadastrar-se</button>
    </div>

    <form id="formLogin">
        <input type="text" name="username" placeholder="usuario">
        <input type="password" name="password" placeholder="senha">
        <button>entrar</button>
    </form>

    <form id="formCadastro" style="display:none">
        <input type="text" name="username" placeholder="usuario">
        <input type="text" name="email" placeholder="email">
        <input type="password" name="password" placeholder="senha">
        <button>cadastrar</button>
    </form>

    <script>
        const formLogin = document.getElementById("formLogin")
        const formCadastro = document.getElementById("formCadastro")
        const abaLogin = document.getElementById("abaLogin")
        const abaCadastro = document.getElementById("abaCadastro")

        function mostrarLogin() {
            formLogin.style.display = "flex"
            formCadastro.style.display = "none"
            abaLogin.classList.add("ativa")
            abaCadastro.classList.remove("ativa")
        }

        function mostrarCadastro() {
            formCadastro.style.display = "flex"
            formLogin.style.display = "none"
            abaCadastro.classList.add("ativa")
            abaLogin.classList.remove("ativa")
        }

        abaLogin.addEventListener("click", mostrarLogin)
        abaCadastro.addEventListener("click", mostrarCadastro)

        formLogin.addEventListener("submit", async (ev) => {
            ev.preventDefault()
            const resp = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: formLogin.username.value,
                    password: formLogin.password.value
                })
            })
            if (resp.ok) {
                window.location.href = "/home"
                return
            }
            const dados = await resp.json()
            alert(dados.msg)
        })

        formCadastro.addEventListener("submit", async (ev) => {
            ev.preventDefault()
            const resp = await fetch("/api/cadastro", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: formCadastro.username.value,
                    email: formCadastro.email.value,
                    password: formCadastro.password.value
                })
            })
            if (resp.ok) {
                alert("Cadastrado! Agora e so entrar.")
                formCadastro.reset()
                mostrarLogin()
                return
            }
            const dados = await resp.json()
            alert(dados.msg)
        })
    </script>
</body>
</html>
